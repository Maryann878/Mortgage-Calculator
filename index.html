<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Mortgage repayment calculator</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <section class="calculator">
        <header>
          <h1>Mortgage Calculator</h1>
          <button
            type="button"
            class="clear"
            id="clearBtn"
            aria-label="Clear all form fields"
          >
            Clear All
          </button>
        </header>

        <form>
          <div class="form-group">
            <label for="amount">Mortgage Amount</label>
            <div class="input-with-icon">
              <span class="icon">£</span>
              <input
                type="text"
                id="amount"
                placeholder=""
                aria-describedby="amount-error"
                aria-invalid="false"
              />
            </div>
            <p class="error-message" id="amount-error" role="alert"></p>
          </div>

          <div class="form-row">
            <div class="form-group" id="group-term">
              <label for="term">Mortgage Term</label>
              <div class="input-with-suffix">
                <input
                  type="number"
                  id="term"
                  placeholder=""
                  min="1"
                  max="50"
                  aria-describedby="term-error"
                  aria-invalid="false"
                />
                <span class="suffix">years</span>
              </div>
              <p class="error-message" id="term-error" role="alert"></p>
            </div>
            <div class="form-group" id="group-rate">
              <label for="rate">Interest Rate</label>
              <div class="input-with-suffix">
                <input
                  type="number"
                  step="0.01"
                  id="rate"
                  placeholder=""
                  min="0.01"
                  max="25"
                  aria-describedby="rate-error"
                  aria-invalid="false"
                />
                <span class="suffix">%</span>
              </div>
              <p class="error-message" id="rate-error" role="alert"></p>
            </div>
          </div>
          <fieldset class="form-group" id="Mortgage-type">
            <legend class="legend">Mortgage Type</legend>
            <label class="radio">
              <input
                type="radio"
                name="type"
                value="repayment"
                aria-describedby="type-error"
                aria-invalid="false"
              />
              <span class="mortgage-type-option">Repayment</span>
            </label>
            <label class="radio">
              <input
                type="radio"
                name="type"
                value="interest-only"
                aria-describedby="type-error"
                aria-invalid="false"
              />
              <span class="mortgage-type-option">Interest Only</span>
            </label>
            <p class="error-message" id="type-error" role="alert"></p>
          </fieldset>
          <button type="submit" class="btn" id="calcBtn">
            <span class="btn-icon"
              ><img
                src="/assets/images/icon-calculator.svg"
                alt="button icon" /></span
            ><span class="btn-text">Calculate Repayments</span>
          </button>
        </form>
      </section>
      <!-- Empty results start -->
      <section class="results" id="results" aria-live="polite">
        <div class="illustration">
          <img
            src="/assets/images/illustration-empty.svg"
            alt="calculator illustration"
          />
        </div>
        <h2 class="results-topic">Results shown here</h2>
        <p class="instruction">
          Complete the form and click <strong>“calculate repayments”</strong>
          to see what your monthly repayments would be.
        </p>
      </section>
    </main>
    <div class="footer">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">MaryAnn</a>.
    </div>
    <script src="./script.js"></script>
  </body>
</html>
